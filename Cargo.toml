[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
fontdue = "0.9"
winit = "0.30"
softbuffer = "0.4"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
